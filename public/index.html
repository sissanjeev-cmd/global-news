<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Global News — World Headlines Aggregated</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ── HEADER ───────────────────────────────────────────────── -->
  <header class="site-header">
    <div class="header-inner">
      <div class="header-brand">
        <div class="brand-globe" aria-hidden="true">🌐</div>
        <div class="brand-text">
          <h1 class="brand-name">Global<span class="brand-accent">News</span></h1>
          <p class="brand-tagline">24 sources · AI-classified · Auto-refreshing</p>
        </div>
      </div>

      <div class="header-controls">
        <div class="status-bar">
          <span class="status-dot" id="statusDot"></span>
          <span class="status-text" id="statusText">Loading...</span>
        </div>
        <div class="refresh-info">
          <span class="refresh-label">Next refresh in</span>
          <span class="refresh-countdown" id="countdownTimer">—</span>
        </div>
        <button class="btn-refresh" id="btnRefresh" title="Refresh now">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <polyline points="23 4 23 10 17 10"></polyline>
            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
          </svg>
          <span>Refresh</span>
        </button>
        <button class="btn-theme" id="btnTheme" title="Toggle theme" aria-label="Toggle dark/light mode">
          <span class="theme-icon-dark">🌙</span>
          <span class="theme-icon-light">☀️</span>
        </button>
      </div>
    </div>

    <!-- Navigation tabs -->
    <nav class="section-nav" id="sectionNav" role="navigation" aria-label="Section navigation">
      <div class="nav-inner">
        <button class="nav-tab active" data-section="all">All Sources</button>
        <button class="nav-tab" data-section="cross-tech">💻 IT & Tech</button>
        <button class="nav-tab" data-section="cross-jobcuts">📉 Job Cuts</button>
        <button class="nav-tab" data-section="cross-ai">🤖 LLM & AI</button>
        <div class="nav-divider" aria-hidden="true"></div>
        <button class="nav-tab" data-section="region-US">🇺🇸 US</button>
        <button class="nav-tab" data-section="region-UK">🇬🇧 UK</button>
        <button class="nav-tab" data-section="region-India">🇮🇳 India</button>
        <button class="nav-tab" data-section="region-Europe">🇪🇺 Europe</button>
        <button class="nav-tab" data-section="region-Asia">🌏 Asia-Pacific</button>
        <button class="nav-tab" data-section="region-Middle East">🌍 Middle East</button>
      </div>
    </nav>
  </header>

  <!-- ── MAIN CONTENT ──────────────────────────────────────────── -->
  <main class="main-content" id="mainContent">

    <!-- Loading skeleton -->
    <div class="loading-screen" id="loadingScreen">
      <div class="loading-inner">
        <div class="loading-globe">🌐</div>
        <h2 class="loading-title">Aggregating world news…</h2>
        <p class="loading-sub">Fetching from 24 global sources</p>
        <div class="loading-sources" id="loadingSources"></div>
        <div class="loading-bar"><div class="loading-fill"></div></div>
      </div>
    </div>

    <!-- Error state -->
    <div class="error-screen hidden" id="errorScreen">
      <div class="error-inner">
        <div class="error-icon">⚠️</div>
        <h2>Couldn't load news</h2>
        <p id="errorMessage">Server may be starting up. Try again in a moment.</p>
        <button class="btn-refresh" onclick="window.newsApp.forceRefresh()">Try Again</button>
      </div>
    </div>

    <!-- Stats bar -->
    <div class="stats-bar hidden" id="statsBar">
      <span id="statArticles">—</span>
      <span class="stat-sep">·</span>
      <span id="statSources">—</span>
      <span class="stat-sep">·</span>
      <span id="statUpdated">—</span>
      <span class="stat-badge" id="cachebadge"></span>
    </div>

    <!-- Cross-section panels (AI + Tech + Job Cuts) -->
    <div class="cross-sections hidden" id="crossSections"></div>

    <!-- Source sections -->
    <div class="source-sections hidden" id="sourceSections"></div>

  </main>

  <!-- ── BACK TO TOP ───────────────────────────────────────────── -->
  <button class="back-to-top hidden" id="backToTop" aria-label="Back to top">↑</button>

  <!-- ── TOAST ─────────────────────────────────────────────────── -->
  <div class="toast hidden" id="toast" role="alert" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
