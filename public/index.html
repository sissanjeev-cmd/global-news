<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Global News — World Headlines</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,400;0,8..60,600;1,8..60,300;1,8..60,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ══ MASTHEAD ════════════════════════════════════════════════ -->
  <header class="masthead">
    <div class="masthead-top">
      <div class="masthead-meta">
        <span id="currentDate"></span>
        <span class="masthead-sep">·</span>
        <span id="statSources">—</span>
        <span class="masthead-sep">·</span>
        <span id="statArticles">—</span>
      </div>
      <div class="masthead-controls">
        <div class="live-badge">
          <span class="status-dot" id="statusDot"></span>
          <span id="statusText">Loading</span>
        </div>
        <span class="countdown-wrap">↻ <span id="countdownTimer">—</span></span>
        <button class="ctrl-btn" id="btnRefresh" title="Refresh now">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
          Refresh
        </button>
        <button class="ctrl-btn ctrl-theme" id="btnTheme" title="Toggle theme">
          <span class="icon-dark">🌙</span><span class="icon-light">☀️</span>
        </button>
      </div>
    </div>

    <!-- Title block -->
    <div class="masthead-title-block">
      <div class="masthead-rule"></div>
      <div class="masthead-logo">
        <span class="logo-globe">🌐</span>
        <h1 class="logo-text">Global<span class="logo-accent">News</span></h1>
      </div>
      <p class="masthead-tagline">AI-Classified · 24 Sources · Auto-Refreshing Every 15 Minutes</p>
      <div class="masthead-rule"></div>
      <div class="masthead-updated" id="statUpdated"></div>
    </div>

    <!-- Section nav -->
    <nav class="section-nav" id="sectionNav">
      <div class="nav-inner">
        <button class="nav-tab active" data-section="all">All Sources</button>
        <span class="nav-sep">|</span>
        <button class="nav-tab" data-section="cross-tech">💻 IT &amp; Tech</button>
        <button class="nav-tab" data-section="cross-jobcuts">📉 Job Cuts</button>
        <button class="nav-tab" data-section="cross-ai">🤖 LLM &amp; AI</button>
        <span class="nav-sep">|</span>
        <button class="nav-tab" data-section="region-US">🇺🇸 US</button>
        <button class="nav-tab" data-section="region-UK">🇬🇧 UK</button>
        <button class="nav-tab" data-section="region-India">🇮🇳 India</button>
        <button class="nav-tab" data-section="region-Europe">🇪🇺 Europe</button>
        <button class="nav-tab" data-section="region-Asia">🌏 Asia-Pacific</button>
        <button class="nav-tab" data-section="region-Middle East">🌍 Middle East</button>
      </div>
    </nav>
  </header>

  <!-- ══ MAIN ════════════════════════════════════════════════════ -->
  <main class="main-content" id="mainContent">

    <!-- Loading -->
    <div class="loading-screen" id="loadingScreen">
      <div class="loading-inner">
        <div class="loading-globe">🌐</div>
        <h2>Aggregating world headlines…</h2>
        <p>Fetching from 24 global sources</p>
        <div class="loading-bar"><div class="loading-fill"></div></div>
      </div>
    </div>

    <!-- Error -->
    <div class="error-screen hidden" id="errorScreen">
      <div class="error-inner">
        <div style="font-size:3rem">⚠️</div>
        <h2>Couldn't load news</h2>
        <p id="errorMessage">news.json not found. Trigger a GitHub Actions run first.</p>
        <button class="ctrl-btn" onclick="window.newsApp.forceRefresh()">Try Again</button>
      </div>
    </div>

    <!-- Cross sections -->
    <div class="cross-sections hidden" id="crossSections"></div>

    <!-- Source sections -->
    <div class="source-sections hidden" id="sourceSections"></div>

  </main>

  <button class="back-to-top hidden" id="backToTop">↑</button>
  <div class="toast hidden" id="toast" role="alert"></div>

  <script src="app.js"></script>
</body>
</html>
