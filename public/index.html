<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Global Briefing — World Headlines</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

<!-- ══ TOPBAR ═════════════════════════════════════════════════ -->
<div class="topbar">
  <div class="topbar-inner">
    <span class="topbar-date" id="currentDate"></span>
    <div class="topbar-right">
      <span class="live-dot-wrap">
        <span class="ldot" id="statusDot"></span>
        <span id="statusText" class="live-label">Loading</span>
      </span>
      <span class="tb-countdown" id="countdownTimer"></span>
      <button class="tb-btn" id="btnRefresh">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
        Refresh
      </button>
      <button class="tb-btn tb-theme" id="btnTheme">
        <span class="dk">🌙</span><span class="lt">☀️</span>
      </button>
    </div>
  </div>
</div>

<!-- ══ MASTHEAD ════════════════════════════════════════════════ -->
<header class="masthead">
  <div class="masthead-inner">
    <div class="masthead-rule-top"></div>
    <div class="brand-row">
      <span class="brand-icon">🌐</span>
      <h1 class="brand-name">Global <span class="brand-accent">Briefing</span></h1>
    </div>
    <p class="brand-tagline">AI-CLASSIFIED &nbsp;·&nbsp; WORLD HEADLINES &nbsp;·&nbsp; AUTO-REFRESHING EVERY 15 MINUTES</p>
    <div class="masthead-rule-bot"></div>
    <p class="masthead-meta" id="statsMeta"></p>
  </div>
</header>

<!-- ══ BODY LAYOUT ════════════════════════════════════════════ -->
<div class="layout">

  <!-- ── SIDEBAR ──────────────────────────────────────────── -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-inner">

      <!-- Search -->
      <div class="sb-search-wrap">
        <input class="sb-search" id="sbSearch" type="search" placeholder="Filter sources…" autocomplete="off"/>
      </div>

      <!-- "All Sources" button -->
      <button class="sb-all-btn active" id="sbAllBtn" onclick="window.app.selectAll()">
        🌐 All Sources
      </button>

      <!-- Region groups (populated by JS) -->
      <div id="sbRegions"></div>

    </div>
  </aside>

  <!-- ── MAIN PANEL ──────────────────────────────────────── -->
  <main class="main-panel" id="mainPanel">

    <!-- Loading -->
    <div class="loading-screen" id="loadingScreen">
      <div class="loading-inner">
        <div class="loading-globe">🌐</div>
        <h2>Aggregating world headlines…</h2>
        <p>Fetching from global sources</p>
        <div class="loading-bar"><div class="loading-fill"></div></div>
      </div>
    </div>

    <!-- Error -->
    <div class="error-screen hidden" id="errorScreen">
      <div class="error-inner">
        <div style="font-size:3rem;margin-bottom:16px">⚠️</div>
        <h2>Couldn't load news</h2>
        <p id="errorMessage">Trigger a GitHub Actions run first.</p>
        <button class="tb-btn" style="margin-top:20px;padding:8px 20px" onclick="window.app.forceRefresh()">Try Again</button>
      </div>
    </div>

    <!-- Selected source heading (shown when a single source is selected) -->
    <div class="panel-heading hidden" id="panelHeading">
      <div class="ph-rule"></div>
      <div class="ph-row">
        <div>
          <h2 class="ph-source-name" id="phSourceName"></h2>
          <span class="ph-meta" id="phMeta"></span>
        </div>
        <button class="ph-close" onclick="window.app.selectAll()" title="Back to all sources">✕ All Sources</button>
      </div>
    </div>

    <!-- Article feed -->
    <div class="article-feed hidden" id="articleFeed"></div>

  </main>
</div>

<button class="back-to-top hidden" id="backToTop">↑</button>
<div class="toast hidden" id="toast" role="alert"></div>

<!-- Mobile sidebar toggle -->
<button class="mob-sidebar-toggle" id="mobSidebarToggle" aria-label="Toggle sources">☰ Sources</button>

<script src="app.js"></script>
</body>
</html>
