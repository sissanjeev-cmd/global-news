<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GlobalNews — World Headlines</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

<!-- ══ MASTHEAD ═══════════════════════════════════════════════ -->
<header class="masthead">

  <!-- dateline strip -->
  <div class="dateline">
    <span id="currentDate"></span>
    <span class="dl-dot">·</span>
    <span id="statSources">—</span>
    <span class="dl-dot">·</span>
    <span id="statArticles">—</span>
    <div class="dl-right">
      <span class="live-pill">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusText">Loading</span>
      </span>
      <span class="countdown" id="countdownTimer">—</span>
      <button class="hdr-btn" id="btnRefresh">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
        Refresh
      </button>
      <button class="hdr-btn hdr-theme" id="btnTheme">
        <span class="dk">🌙</span><span class="lt">☀️</span>
      </button>
    </div>
  </div>

  <!-- masthead logo -->
  <div class="masthead-logo-wrap">
    <div class="masthead-rule-top"></div>
    <div class="masthead-brand">
      <span class="brand-globe">🌐</span>
      <h1 class="brand-title">Global<span class="brand-blue">News</span></h1>
    </div>
    <p class="brand-sub">AI-CLASSIFIED &nbsp;·&nbsp; 24 SOURCES &nbsp;·&nbsp; AUTO-REFRESHING EVERY 15 MINUTES</p>
    <div class="masthead-rule-bot"></div>
    <p class="masthead-updated" id="statUpdated"></p>
  </div>

  <!-- nav -->
  <nav class="section-nav" id="sectionNav">
    <div class="nav-inner">
      <button class="nav-tab active" data-section="all">All Sources</button>
      <span class="nav-pipe">|</span>
      <button class="nav-tab" data-section="cross-tech">💻 IT &amp; Tech</button>
      <button class="nav-tab" data-section="cross-jobcuts">📉 Job Cuts</button>
      <button class="nav-tab" data-section="cross-ai">🤖 LLM &amp; AI</button>
      <span class="nav-pipe">|</span>
      <button class="nav-tab" data-section="region-US">🇺🇸 US</button>
      <button class="nav-tab" data-section="region-UK">🇬🇧 UK</button>
      <button class="nav-tab" data-section="region-India">🇮🇳 India</button>
      <button class="nav-tab" data-section="region-Europe">🇪🇺 Europe</button>
      <button class="nav-tab" data-section="region-Asia">🌏 Asia-Pacific</button>
      <button class="nav-tab" data-section="region-Middle East">🌍 Middle East</button>
    </div>
  </nav>
</header>

<!-- ══ MAIN ════════════════════════════════════════════════════ -->
<main class="main" id="mainContent">

  <div class="loading-screen" id="loadingScreen">
    <div class="loading-inner">
      <div class="loading-globe">🌐</div>
      <h2>Aggregating world headlines…</h2>
      <p>Fetching from 24 global sources</p>
      <div class="loading-bar"><div class="loading-fill"></div></div>
    </div>
  </div>

  <div class="error-screen hidden" id="errorScreen">
    <div class="error-inner">
      <div style="font-size:3rem;margin-bottom:16px">⚠️</div>
      <h2>Couldn't load news</h2>
      <p id="errorMessage">Try refreshing or trigger a GitHub Actions run.</p>
      <button class="hdr-btn" style="margin-top:16px" onclick="window.newsApp.forceRefresh()">Try Again</button>
    </div>
  </div>

  <!-- Cross sections (IT&Tech / Job Cuts / AI) -->
  <div class="cross-sections hidden" id="crossSections"></div>

  <!-- Source sections -->
  <div class="source-sections hidden" id="sourceSections"></div>

</main>

<button class="back-to-top hidden" id="backToTop" aria-label="Back to top">↑</button>
<div class="toast hidden" id="toast" role="alert"></div>

<script src="app.js"></script>
</body>
</html>
