name: Fetch & Deploy News

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes
  workflow_dispatch:           # manual trigger from GitHub UI
  push:
    branches: [main]           # also run on every push

permissions:
  contents: write              # needed to commit news.json back to repo
  pages: write                 # needed to deploy to GitHub Pages
  id-token: write

jobs:
  # ── Job 1: Fetch RSS + AI classify → commit news.json ─────────
  fetch-and-classify:
    name: Fetch RSS & Classify
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0        # full history so rebase works

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Fetch RSS feeds & classify articles
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/build-news.js

      - name: Commit updated news.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/news.json
          # Skip if nothing changed
          git diff --cached --quiet && echo "No changes to news.json" && exit 0
          git commit -m "chore: refresh news data [skip ci]"
          # Rebase on top of any commits that landed while we were running
          git pull --rebase origin main
          git push origin main

  # ── Job 2: Deploy public/ to GitHub Pages ─────────────────────
  deploy-pages:
    name: Deploy to GitHub Pages
    needs: fetch-and-classify
    if: always()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main             # pick up the freshly committed news.json

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public/         # serve everything in public/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
