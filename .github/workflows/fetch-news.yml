name: Fetch & Deploy News

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes
  workflow_dispatch:           # manual trigger from GitHub UI
  push:
    branches: [main]           # also run on every push

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # ── Job 1: Fetch RSS + AI classify → commit news.json ─────────
  fetch-and-classify:
    name: Fetch RSS & Classify
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Fetch RSS feeds & classify articles
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/build-news.js

      - name: Commit updated news.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/news.json
          # Skip if nothing changed
          if git diff --cached --quiet; then
            echo "No changes to news.json, skipping commit"
            exit 0
          fi
          git commit -m "chore: refresh news data [skip ci]"
          # Force push with lease — safe: only fails if someone else pushed
          # Retry up to 3 times with rebase
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin main && break
            echo "Push attempt $i failed, retrying..."
            sleep 5
          done

  # ── Job 2: Deploy public/ to GitHub Pages ─────────────────────
  deploy-pages:
    name: Deploy to GitHub Pages
    needs: fetch-and-classify
    if: always()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
